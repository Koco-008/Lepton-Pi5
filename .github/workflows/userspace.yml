name: Userspace build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lepton-streamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build streamer with strict warnings
        run: >-
          make -C lepton_streamer clean all
          CFLAGS='-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror'
      - name: Run deterministic frame pipeline tests
        run: >-
          make -C lepton_streamer check
          CFLAGS='-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror'
      - name: Validate shell syntax
        run: |
          sh -n tools/install_streams_rpi5.sh
          sh -n tools/uninstall_streams_rpi5.sh
          sh -n tools/test_streams_rpi5.sh
          sh -n tools/diagnose.sh
